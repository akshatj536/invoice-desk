[project]
name = "invoice-agent"
version = "0.1.0"
description = "Invoice PDF -> PO match -> explained decision (Zamp ASA case study, PS-1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "gspread>=6.1",
    "google-auth>=2.35",
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "reportlab>=4.2",
    "pillow>=11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
